<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="岩迹">
<meta name="theme-color" content="#F4F0E6">
<title>岩迹</title>
<!-- 全部文字用霞鹜文楷（OFL 开源，商用免费）。按字符分块，只下载用到的字；都取不到时退回系统楷体 -->
<!-- 霞鹜文楷放在项目里（fonts/lxgw-wenkai），本地文件取不到时每个分块再退到 jsDelivr -->
<link rel="stylesheet" href="fonts/lxgw-wenkai/lxgw-wenkai.css">
<style>
:root{
  --paper:#F4F0E6; --card:#FBF8F1; --ink:#1F1D19; --muted:#726C5F; --hair:#D8D1C1;
  --accent:#E2552B;
  /* 全部文字都用霞鹜文楷；网络字体没加载完时退到系统楷体，不会冒出宋体 */
  --serif:"LXGW WenKai","Kaiti SC","STKaiti",serif;
  --mono:var(--serif);
  --sans:var(--serif);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#E7E1D3;font-family:var(--sans);color:var(--ink);display:flex;align-items:center;justify-content:center}
.phone{width:100%;max-width:390px;height:100%;max-height:844px;background:var(--paper);position:relative;overflow:hidden;overflow:clip;display:flex;flex-direction:column}
@media(min-width:500px){.phone{border-radius:38px;box-shadow:0 30px 80px rgba(60,50,30,.25);border:1px solid #cfc7b4}}
main{flex:1;overflow-y:auto;padding:calc(22px + env(safe-area-inset-top)) 24px calc(184px + env(safe-area-inset-bottom))}
.page{display:none}.page.on{display:block}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
h1{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.2;margin:8px 0 4px}
.sub{font-size:13px;color:var(--muted);line-height:1.6;text-wrap:pretty;text-align:justify}
.sub b{white-space:nowrap}
.big{font-family:var(--mono);font-size:54px;letter-spacing:-.04em;line-height:1}
.big small{font-size:16px;letter-spacing:0;color:var(--muted);margin-left:6px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-top:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stats{display:flex;justify-content:space-between;margin-top:24px;border-top:1px solid var(--ink);border-bottom:1px solid var(--hair)}
.stats div{padding:12px 0}
.stats div:nth-child(2){text-align:center}.stats div:last-child{text-align:right}
.stats b{display:block;font-family:var(--mono);font-size:20px;font-weight:500;line-height:28px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stats b small{font-size:12px;font-weight:400;color:var(--muted);margin-left:2px}
.stats b i{font-style:normal;font-weight:400;color:var(--hair);margin:0 3px}
.stats.soft{border-top-color:var(--hair)}
.stats span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:11px;color:var(--muted)}
.legend i{font-style:normal;font-family:var(--mono);color:var(--ink);margin-right:4px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i.k{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--accent);margin:0}
.legend i.k.ghost{background:none;border:1px dashed var(--muted)}
.link{font-size:12px;color:var(--muted);background:none;border:none;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-family:var(--sans);padding:12px 8px;margin:-12px -8px}
h2{font-family:var(--serif);font-size:17px;font-weight:600;margin:32px 0 4px}
.yrs{font-family:var(--mono);font-size:11px;color:var(--muted)}.yrs em{font-style:normal}
.mname{font-family:var(--serif);font-size:22px;font-weight:600;margin-top:4px}
.mnum{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}.mnum b{font-size:20px;font-weight:500;color:var(--ink)}
.summit{margin-top:12px;padding:14px;border:1px solid var(--accent);border-radius:16px;background:var(--card)}
.summit b{display:block;font-family:var(--serif);font-size:22px;font-weight:600;margin-top:4px}.summit em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted)}
.summit.stopcard{border-color:var(--hair)}
button.stamp{background:none;border:none;padding:0;font:inherit;cursor:pointer}
.stamp.paused svg{color:var(--muted)}.stamp.paused em{color:var(--ink)}
.peak{display:flex;gap:16px;align-items:center;margin:8px 0 6px}.peak svg{width:130px;height:120px;flex:none;color:var(--ink)}
.gyms{margin-top:10px;display:grid;gap:4px}
.gyms button{display:grid;grid-template-columns:minmax(0,40%) 1fr auto;gap:10px;align-items:center;background:none;border:none;border-radius:12px;padding:7px 8px;margin:0 -8px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.gyms button.on{background:var(--card);box-shadow:inset 0 0 0 1px var(--ink)}
.gyms b{display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gyms em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted)}
.gyms i{height:3px;background:var(--hair);border-radius:2px;display:block}.gyms u{display:block;height:100%;background:var(--ink);border-radius:2px}
.bests{display:grid;grid-template-columns:repeat(4,1fr);margin-top:10px;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:12px 0}
.bests b{display:block;font-family:var(--mono);font-size:20px;font-weight:500;margin-top:2px}.bests em{font-style:normal;font-size:11px;color:var(--muted)}
.wheelbox{position:relative;margin:6px -24px 0}
.wheel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px calc(50% - 32px) 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.wheel::-webkit-scrollbar{display:none}
.wheel button{flex:0 0 64px;scroll-snap-align:center;background:none;border:none;padding:0;cursor:pointer;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:5px;
  opacity:calc(.3 + .7*var(--k,0));transform:scale(calc(.55 + .45*var(--k,0)));transform-origin:50% 70%}
.wheel button.on{color:var(--ink)}.wheel svg{width:54px;height:56px;display:block}
.wheel i,.wd{display:block;width:6px;height:6px;border-radius:3px;box-sizing:border-box}
.wheel i.now,.wd.now{background:var(--ink)}.wheel i.done,.wd.done{background:var(--accent)}.wheel i.paused,.wd.paused{border:1.2px solid var(--ink)}
.legend i.wd{margin:0}
.wptr{position:absolute;left:50%;top:0;width:0;height:0;margin-left:-5px;border:5px solid transparent;border-top:6px solid var(--ink);pointer-events:none}
#mAct{margin-top:12px;min-height:112px}#mAct .save{margin-top:0}#mAct .save+.sub{margin-top:8px}
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px;margin-top:12px}
.stamp{text-align:center;color:var(--ink)}.stamp svg{display:block;width:100%;height:62px;margin:0 auto 4px}
.stamp b{display:block;font-family:var(--serif);font-size:12px;font-weight:600;line-height:1.3}
.stamp em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted)}
.stamp.todo svg{color:var(--hair)}.stamp.todo b{color:var(--muted);font-weight:400}.stamp.now svg{color:var(--muted)}.stamp.now em{color:var(--ink)}
.yrs button{background:none;border:none;font:inherit;color:var(--muted);padding:6px 5px;cursor:pointer}.yrs button.on{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:16px;align-items:end;margin-top:12px;padding-top:12px;border-top:1px solid var(--ink)}
.hero>b{display:block;font-family:var(--mono);font-size:54px;font-weight:500;letter-spacing:-.04em;line-height:1}
.hero>em{display:flex;align-items:center;gap:6px;font-style:normal;font-size:13px;margin-top:12px;align-self:baseline}.hero>em svg{color:var(--muted)}
.hnote{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:4px}
.hnone{grid-column:2;grid-row:1/3;justify-self:end;font-size:12px;color:var(--muted)}
.hwall{justify-self:end;background:none;border:none;padding:0;cursor:pointer}.hwall>svg{display:block;height:60px;width:auto;margin-bottom:4px}
.hname{justify-self:end;align-self:baseline;display:flex;align-items:baseline;gap:8px;max-width:100%;min-width:0;margin-top:12px;background:none;border:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:right}
.hname b{color:var(--ink);font-family:var(--sans);font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hname em{flex:none;font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.hchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.hchips button{display:flex;align-items:center;gap:5px;border:1px solid var(--hair);background:none;border-radius:13px;padding:4px 10px;font:inherit;font-size:12px;color:var(--muted);cursor:pointer}
.hchips b{font-family:var(--mono);font-weight:500;font-size:12px;color:var(--ink);margin-left:2px}
.hsum{margin-top:12px;padding-bottom:14px;border-bottom:1px solid var(--hair);font-size:13px;color:var(--muted)}.hsum b{font-family:var(--mono);font-weight:500;font-size:15px;color:var(--ink)}.hsum i{font-style:normal;margin:0 8px;color:var(--muted)}
.hl{font-family:var(--serif);font-size:19px;line-height:1.6;margin-top:10px}.hl b{font-family:var(--mono);font-weight:500;font-size:21px;margin:0 2px}
.ledger{margin-top:14px;border-top:1px solid var(--ink);border-bottom:1px solid var(--hair)}
.ledger>div{display:grid;grid-template-columns:1fr 76px 52px 52px;align-items:baseline;padding:10px 0;border-top:1px solid var(--hair)}
.ledger>div:first-child{border-top:none;padding:8px 0 0;font-size:11px;color:var(--muted)}
.ledger span{font-size:14px;display:flex;align-items:center;gap:8px}.ledger span svg{color:var(--muted)}
.ledger b{font-family:var(--mono);font-size:19px;font-weight:500}.ledger i{font-style:normal;font-family:var(--mono);font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.ledger>div:first-child i{font-family:var(--sans);font-size:11px}
.hstrip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:10px -24px 0;padding:0 52px 0 24px;scroll-padding-left:24px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hstrip::-webkit-scrollbar{display:none}
.hscroll{overflow-x:auto;margin:12px -24px 0;padding:0 24px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.hscroll::-webkit-scrollbar{display:none}
#histCard{margin-top:12px}
.hday{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:none;border-radius:16px;padding:8px 12px 8px 8px;text-align:left;font:inherit;color:inherit;cursor:pointer;min-width:0}
.hday .c{flex:none;width:84px}.hday .c svg{display:block;width:84px;height:auto}
.hday .t{flex:1;min-width:0}.hday .t b{display:block;font-family:var(--serif);font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hday .t b small{font-family:var(--sans);font-size:11px;color:var(--muted);font-weight:400;margin-left:8px}
.hday .t em{display:block;font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px}.hday .t em.s{color:var(--accent);font-family:var(--sans)}
.hday>i{font-style:normal;font-size:20px;color:var(--muted);font-family:var(--mono)}
.hleg{display:inline-flex;align-items:center;gap:5px}.hleg svg{display:block}
.pseg{display:inline-grid;grid-auto-flow:column;border:1px solid var(--hair);border-radius:20px;overflow:hidden}
.pseg button{border:none;background:none;padding:7px 13px;font:inherit;font-size:12px;color:var(--muted);cursor:pointer}.pseg button.on{background:var(--ink);color:var(--paper)}
.ins{background:var(--card);border-radius:16px;padding:16px;margin-top:12px}.ins[data-rid]{cursor:pointer}
.ins .k,.tile .k{font-size:11px;color:var(--muted);letter-spacing:.08em}
.ins h3{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.3;margin:0 0 12px;text-wrap:pretty}
.ins .n{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.6;text-align:justify}
.ins .why .k2{font-size:11px;color:var(--muted);margin:8px 0 4px}.ins .why .keys{margin-top:10px}
.fallp{display:flex;gap:14px;align-items:center}.fallp>div{flex:1}
.br{display:grid;grid-template-columns:44px 1fr 36px;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-top:9px}.br:first-child{margin-top:0}
.br i{height:6px;border-radius:3px;background:var(--hair);display:block}.br u{display:block;height:100%;background:var(--muted);border-radius:3px}
.br b{font-family:var(--mono);font-weight:500;text-align:right;font-size:12px}.br.on{color:var(--ink)}.br.on u{background:var(--ink)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.tile:last-child:nth-child(odd){grid-column:1/-1}
.tile{background:var(--card);border-radius:16px;padding:12px 14px;min-width:0}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:none;border:none;border-top:1px solid var(--hair);padding:8px 0;font:inherit;color:inherit;text-align:left;cursor:pointer}.prow:first-of-type{border-top:none;padding-top:0}
.prow span{min-width:0}.prow b{display:block;font-family:var(--serif);font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.prow em{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5}.prow svg{flex:none}.prow b i{font-style:normal;font-family:var(--mono);font-weight:500;margin-left:8px}
.tile b{display:block;font-family:var(--mono);font-size:22px;font-weight:500;margin:4px 0;white-space:nowrap}.tile b.w{font-family:var(--serif);font-weight:600}.tile span .nw{display:inline;white-space:nowrap}.tile b small{font-size:11px;font-weight:400;color:var(--muted);margin-left:3px}
.tile span{display:block;font-size:11px;color:var(--muted);line-height:1.5}
.gfl{display:grid;gap:2px;margin-top:10px}.gfl button{display:flex;justify-content:space-between;align-items:baseline;background:none;border:none;border-radius:12px;padding:12px 10px;margin:0 -10px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer;text-align:left}
.gfl button.on{background:var(--paper);box-shadow:inset 0 0 0 1px var(--ink)}.gfl em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted)}
.aichips{display:flex;gap:8px;margin:8px -24px 0;padding:0 24px;overflow-x:auto;scrollbar-width:none}.aichips::-webkit-scrollbar{display:none}.aichips button{flex:none;white-space:nowrap;border:1px solid var(--hair);background:var(--paper);border-radius:16px;padding:6px 12px;font:inherit;font-size:12px;color:var(--ink);cursor:pointer}.aichips button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.aipre{margin-top:14px;max-height:150px;overflow-y:auto;border:1px dashed var(--hair);border-radius:12px;padding:10px 12px;font-size:11px;line-height:1.7;color:var(--muted);white-space:pre-wrap}
.hcard{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--hair);border-radius:14px;margin-top:8px}
.hgo{flex:1;display:flex;gap:12px;align-items:center;background:none;border:none;padding:10px 4px 10px 10px;text-align:left;font:inherit;color:inherit;cursor:pointer;min-width:0}
.hm{flex:0 0 96px}.hi{display:flex;flex-direction:column;gap:2px;min-width:0}
.hi b{font-family:var(--mono);font-size:24px;font-weight:500;letter-spacing:-.03em;line-height:1.15}
.hi em{font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi u{font-size:12px;color:var(--ink);text-underline-offset:3px;margin-top:4px}
.hstep{display:flex;flex-direction:column;border-left:1px solid var(--hair)}
.hstep button{flex:1;width:40px;background:none;border:none;font-size:20px;color:var(--ink);cursor:pointer;font-family:var(--mono)}
.hstep button+button{border-top:1px solid var(--hair)}.hstep button:disabled{color:var(--hair)}
.strip{display:flex;gap:8px;overflow-x:auto;margin:12px -24px 0;padding:0 24px 6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.demo{margin-top:24px;padding:10px 12px;border:1px dashed var(--muted);border-radius:12px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:10px}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:11px 0;border:none;border-bottom:1px solid var(--hair);background:none;text-align:left;cursor:pointer;color:inherit;font:inherit}
.rrow b{display:block;font-family:var(--serif);font-size:15px;font-weight:600}
.rrow em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted)}
.rrow .gl{display:flex;align-items:center;gap:4px;flex-shrink:0}
.mk{display:inline-block;width:10px;height:10px;flex-shrink:0;vertical-align:-1px}
.rrow.plain{cursor:default}
/* 线路簿 */
.bookrow{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--hair)}
.bookrow .bookopen{flex:1;min-width:0;background:none;border:none;padding:10px 0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.bookrow .bookopen b{display:block;font-family:var(--serif);font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bookrow .bookopen em{display:block;font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bookact{flex:none;border:1px solid var(--hair);background:none;border-radius:14px;padding:5px 11px;font:inherit;font-size:12px;color:var(--muted);cursor:pointer}
.bookact:active{opacity:.6}
/* 新建线：名字左边是颜色滚轮，右边是名字 */
.namerow{display:flex;gap:14px;align-items:center;margin-top:8px}
.colwheel{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;gap:4px}
.cwbox{position:relative;height:104px;width:100%;border:1px solid var(--hair);border-radius:12px;background:var(--paper);overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 22%,#000 78%,transparent)}
.cw{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;padding:35px 0;scrollbar-width:none}
.cw::-webkit-scrollbar{display:none}
.colchip{display:flex;align-items:center;justify-content:center;width:100%;height:34px;border:none;background:none;cursor:pointer;
  scroll-snap-align:center;opacity:calc(.22 + .78*var(--k,0));transform:scale(calc(.66 + .34*var(--k,0)))}
.colchip .tape{width:34px;height:13px;margin:0}
.colchip.none{font-family:var(--serif);font-size:10px;color:var(--muted)}
.cwname{font-size:10px;color:var(--muted);font-family:var(--mono)}
.namecol{flex:1;min-width:0}
.namecol .field{margin-top:0;height:46px}
/* 拆线：全屏居中层 + 背景模糊，动画期间页面不换 */
.stripLayer{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:26px;
  background:rgba(244,240,230,.55);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
  opacity:0;pointer-events:none;transition:opacity .22s ease}
.stripLayer.on{opacity:1;pointer-events:auto}
.stripCard{width:100%;max-width:332px;background:var(--card);border-radius:22px;padding:14px 16px 16px;
  box-shadow:0 18px 50px rgba(40,35,25,.18);text-align:center;transform:translateY(8px) scale(.98);
  transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.stripLayer.on .stripCard{transform:none}
.strip-hint{font-size:12px;color:var(--muted);margin-top:2px}
.strip-done{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--accent);margin-top:2px;opacity:0}
.stripCard .link{margin-top:6px}
#stBolt,#stHold{transform-box:fill-box;transform-origin:center}
#stToolWrap{transform:translate(200px,0)}
.stripgo #stToolWrap{animation:stToolIn .3s cubic-bezier(.2,.8,.2,1) .12s both,stToolOut .7s ease-in 1.6s both}
.stripgo #stBolt{animation:stBoltSpin 1s cubic-bezier(.4,0,.6,1) .5s both}
.stripgo #stSpin{animation:stSpinA 1s linear .5s both}

const LEAD=['5.8','5.9','5.10a','5.10b','5.10c','5.10d','5.11a','5.11b','5.11c','5.11d','5.12a','5.12b','5.12c','5.12d','5.13a'];

const gi=r=>scale(r.type).indexOf(r.grade);
const pad2=n=>String(n).padStart(2,'0');

   ['灰色 2 号','5.10d',15,'32:f.4:p','28:h3:p','28:f.6:p','25:h2:p','18:h1:p','18:s','16:s::tr','14:s'],

/* ---------- 拆线：全屏居中层 + 电动螺丝刀把岩点上的 M10 螺丝拧下来（螺丝带磁，被批头吸走） ---------- */
let stripRid=null,stripBack=null,stripTimer=null,stripVib=null;
function startStrip(rid,back){
  stripRid=rid;stripBack=back||null;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){finishStrip();return}
  const r=R(rid),layer=$('stripLayer');
  const type=HOLD_TYPES.find(h=>h.id===window.__forceHold)||pickHold();
  const k=r?(r.color||colorOf(r.name)):null;
  layer.innerHTML=stripScene(type,k,r?r.name:'');
  layer.classList.add('on');
  requestAnimationFrame(()=>{const w=$('stripwrap');if(w)w.classList.add('stripgo')});
  clearTimeout(stripTimer);clearTimeout(stripVib);
  stripVib=setTimeout(()=>{if(navigator.vibrate)navigator.vibrate(8)},1600);
  stripTimer=setTimeout(finishStrip,3250);
}
function cancelStrip(){if(!stripRid)return false;
  clearTimeout(stripTimer);clearTimeout(stripVib);stripRid=null;stripBack=null;stripTimer=null;stripVib=null;
  const layer=$('stripLayer');if(layer)layer.classList.remove('on');return true}
function finishStrip(){
  if(!stripRid)return;
  const r=R(stripRid),back=stripBack;stripRid=null;stripBack=null;stripTimer=null;clearTimeout(stripVib);
  const layer=$('stripLayer');if(layer)layer.classList.remove('on');
  if(r){r.retired=true;persist()}
  if(navigator.vibrate)navigator.vibrate(12);
  if(back==='routes'){mode='routes';renderSheet()}
  else{mode='pick';renderAll()}
}
$('stripLayer').onclick=e=>{if(e.target.closest('#stripCancel')||e.target===$('stripLayer'))cancelStrip()};
$('p-route').onclick=e=>{const b=e.target.closest('button');if(!b)return;const r=R(curRid);
  if(b.id==='rback')go(backTo);
  else if(b.dataset.rs!==undefined){routeSel=b.dataset.rs||null;renderRoute()}
  else if(b.id==='rename')renameAsk(r,false);
  else if(b.id==='merge'){const t=twinOf(r);if(t)ask({title:'合并同名的线',body:`把这两条「${esc(r.name)} · ${meta(r)}」合成一条，两边的攀爬记录按时间排在一起。合并后不能拆开。`,lock:true,yes:'合并',onYes:()=>{mergeRoutes(r,t);closeSheet();renderAll()}})}
  else if(b.id==='del')ask({title:'删除这条线',body:`「${esc(r.name)}」和它的 ${climbsOf(r.id).length} 次攀爬记录会一起删掉，不能恢复。`,lock:true,yes:'删除',onYes:()=>{data.climbs=data.climbs.filter(c=>c.rid!==r.id);data.routes=data.routes.filter(x=>x.id!==r.id);persist();closeSheet();go(backTo)}})
  else if(b.id==='retire'){if(r.retired)restoreRoute(r);else startStrip(r.id,null)}
  else if(b.id==='again'){if(r.retired)return;data.gym=r.gym;startForm(r.id);
    if(r.type!=='b'&&routeSel){const cl=routeClimbs(r);draft.mode=cl.length?cMode(cl[cl.length-1],r):(routeSel==='up'?'tr':'lead')}
    openSheet('form')}
  else if(b.id==='replay')replay(r.id,routeClimbs(r))};
// 回放：按时间顺序，把每一次攀爬在同一条线上重演一遍
async function replay(rid,list){
  const tok=++playTok,r=R(rid),all=climbsOf(rid),cs=list||all,{x,yG,HH}=RG,G=geom(r,x,yG,HH,false,1,2);
  const prog=$('rprog'),dot=$('rdot'),marks=$('rmarks'),cap=$('rcap');if(!prog||!cs.length)return;
  const live=()=>tok===playTok&&$('rprog')===prog,ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
  const tween=(ms,fn)=>new Promise(res=>{const t0=performance.now();const st=()=>{if(!live())return res();
    const k=Math.min(1,(performance.now()-t0)/ms);fn(k);k<1?setTimeout(st,16):res()};st()});
  const at=h=>{prog.setAttribute('d',G.to(h));dot.setAttribute('cx',G.xa(h).toFixed(1));dot.setAttribute('cy',G.Y(h).toFixed(1))};
  marks.innerHTML='';dot.style.display='';at(0);
  for(let i=0;i<cs.length&&live();i++){const c=cs[i],top=c.result==='fail'?c.high:1;let from=0;
    cap.textContent=`第 ${all.indexOf(c)+1} 次 · ${lab(c.date)}${r.type==='b'?'':' · '+MODE[cMode(c,r)]} · ${desc(c,r)}`;
    const stops=c.result==='hang'?Array.from({length:c.hangs},(_,q)=>(q+1)/(c.hangs+1)):[];
    for(const s of [...stops,top]){const a=from;await tween(850*(s-a)+140,k=>at(a+(s-a)*ease(k)));from=s;
      if(s!==top&&live()){marks.insertAdjacentHTML('beforeend',`<circle class="cur" cx="${G.xa(s).toFixed(1)}" cy="${G.Y(s).toFixed(1)}" r="4.5" fill="var(--card)" stroke="var(--ink)" stroke-width="1.6"/>`);await tween(260,()=>{})}}
    if(!live())return;
    if(c.result==='fail'){const fy=G.Y(top);await tween(280,k=>dot.setAttribute('cy',(fy+20*k*k).toFixed(1)));
      marks.insertAdjacentHTML('beforeend',`<g class="cur">${cross(G.xa(top),fy,4,'var(--ink)',1.6)}</g>`);await tween(340,()=>{})}
    else{const fg=firstGo(c);
      marks.insertAdjacentHTML('beforeend',`<g class="cur">${topDot(G.xa(1),G.Y(1),6,fg?'first':c.result)}</g>`);
      dot.style.display='none';await tween(480,()=>{});dot.style.display=''}
    if(i<cs.length-1&&live()){marks.querySelectorAll('.cur').forEach(el=>{el.classList.remove('cur');el.setAttribute('opacity',c.result==='fail'?.4:0)});
      await tween(260,k=>prog.setAttribute('opacity',1-k));at(0);prog.setAttribute('opacity',1)}}
  if(live()){await tween(900,()=>{});if(live())renderRoute()}}

function crossMode(){const all=[],rows=[];

    lc=cs.filter(c=>MODEG(cMode(c,r))==='lead'),uc=cs.filter(c=>MODEG(cMode(c,r))==='up');

  <text transform="translate(128 70.6) rotate(5.3)" font-size="4.6" fill="var(--muted)" style="font-family:var(--mono);letter-spacing:.06em">↔24 ↕8 kN</text>
  <text x="100" y="49" text-anchor="middle" font-size="14" fill="var(--ink)" style="font-family:var(--serif)">${txt}</text>
  <g transform="rotate(-4 34 24)"><g id="lkG">
    <rect x="34" y="19.6" width="125" height="8.8" rx="2.2" fill="var(--card)" stroke="var(--ink)" stroke-width="1.5"/>
    <path d="M44 22.2H110" stroke="var(--hair)" stroke-width="1"/>
    <rect x="121" y="20.3" width="34" height="7.4" fill="var(--accent)"/>
    <path d="${Array.from({length:8},(_,i)=>`M${123+i*4} 20.6l1.8 6.8`).join('')}" stroke="var(--card)" stroke-width=".8" opacity=".8"/>
    <g id="lkS"><rect x="119" y="15.5" width="42" height="17" rx="3.2" fill="var(--ink)"/>
      <path d="M123 16v16M157 16v16" stroke="var(--paper)" stroke-width=".7" opacity=".55"/><path id="lkK" stroke="var(--paper)" stroke-width="1.1" opacity=".8"/></g>
  </g></g>
  <circle cx="35" cy="23.9" r="2" fill="var(--card)" stroke="var(--ink)" stroke-width="1.3"/></svg>`;
function bindLock(){const L=$('lock');if(!L)return;const S=$('lkS'),K=$('lkK'),G=$('lkG'),MAX=46,sc=()=>200/L.querySelector('svg').getBoundingClientRect().width;let t=0,x0=null,done=false;
  const paint=()=>{S.setAttribute('transform',`translate(${(-t).toFixed(1)} 0)`);
    K.setAttribute('d',Array.from({length:6},(_,i)=>`M${(126+(i*5+t*1.6)%28).toFixed(1)} 17.5v13`).join(''))};
  paint();
  L.onpointerdown=e=>{if(done)return;x0=e.clientX+t/sc();try{L.setPointerCapture(e.pointerId)}catch(_){}};
  L.onpointermove=e=>{if(x0==null||done)return;t=Math.max(0,Math.min(MAX,(x0-e.clientX)*sc()));paint()};
  L.onpointerup=L.onpointercancel=()=>{if(x0==null||done)return;x0=null;
    if(t>=MAX*.9){done=true;t=MAX;paint();G.style.transform='rotate(11deg)';if(navigator.vibrate)navigator.vibrate(15);
      setTimeout(()=>{const err=askCfg.onYes();if(typeof err==='string')$('askErr').textContent=err},300)}
    else{const back=()=>{t=t<1?0:t*.7;paint();if(t)requestAnimationFrame(back)};back()}}}
// 表单里的滚轮（难度横着拨、线长竖着拨）：只负责对齐和把中间那格描深
function fwPaint(w,v){const mid=v?w.scrollTop+w.clientHeight/2:w.scrollLeft+w.clientWidth/2;let best=null,bd=1e9;
  [...w.children].forEach(b=>{if(!b.dataset.v)return;const z=v?b.offsetHeight:b.offsetWidth,d=Math.abs((v?b.offsetTop:b.offsetLeft)+z/2-mid);
    b.style.setProperty('--k',Math.max(0,1-d/z).toFixed(3));if(d<bd){bd=d;best=b}});return best}
function fwTo(w,v,val,smooth){const b=[...w.children].find(x=>x.dataset.v===String(val));if(!b)return;
  w.scrollTo(v?{top:b.offsetTop-(w.clientHeight-b.offsetHeight)/2,behavior:smooth?'smooth':'auto'}:{left:b.offsetLeft-(w.clientWidth-b.offsetWidth)/2,behavior:smooth?'smooth':'auto'});fwPaint(w,v)}
// 点任何按钮前先按滚轮当前停的位置读一次，不只靠滚动事件
function fwSync(){const g=$('gw'),l=$('lw');if(mode!=='form')return;
  if(g&&g.clientWidth){const x=fwPaint(g,0);if(x)draft.type==='b'?draft.gb=x.dataset.v:draft.gl=x.dataset.v}
  if(l&&l.clientHeight){const x=fwPaint(l,1);if(x)draft.wall=+x.dataset.v}}
function saveDraft(useRoute){const b=draft.type==='b',res=dRes();let r=draft.rid&&R(draft.rid);
  if(r){if(!b&&draft.shape)r.shape=draft.shape;else if(!b)delete r.shape}
  else{const name=draft.name.trim(),grade=dGrade();
    if(useRoute)r=useRoute;
    if(!r){const n=data.routes.filter(x=>x.gym===data.gym&&x.grade===grade).length+1;
      r={id:uid(),gym:data.gym,name:name||`${grade} · 第 ${n} 条`,grade,type:draft.type,wall:b?BWALL:draft.wall,since:TODAY};
      if(draft.color)r.color=draft.color;if(!b)r.mode=draft.mode;
      if(!b&&draft.shape)r.shape=draft.shape;data.routes.push(r);
      if(!b){const g=data.gyms.find(x=>x.name===data.gym);if(g)g.wall=draft.wall}}}
  const c={rid:r.id,date:TODAY,t:Date.now(),result:res,hangs:res==='hang'?draft.hangs:0,high:res==='fail'?(b?.5:draft.high):1};
  if(!b&&draft.mode)c.mode=draft.mode;   // 这次实际用的方式（线路的 mode 不动）
  if(res!=='send'&&draft.why)c.why=draft.why;
  data.climbs.push(c);if(!b&&draft.color)lastColorKey=draft.color;persist();return r}
$('sheet').onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;fwSync();
  if(d.peak){bookSel=d.peak;mode='peak';renderSheet();$('sheet').scrollTop=0;return}
  if(d.book){closeSheet();openRoute(d.book);return}
  if(d.strip){startStrip(d.strip,'routes');return}
  if(d.restore){restoreRoute(R(d.restore));return}
  if(b.id==='openBook'){routeBookQ='';mode='routes';renderSheet();return}
  if(b.id==='toBook'){mode='book';renderSheet();return}
  if(b.id==='peakGo'){pickPeak(bookSel);mountView=null;closeSheet();go('mount');return}
  if(b.id==='close'){closeSheet();renderAll();return}
  if(d.gf!=null){gymSel=d.gf||null;closeSheet();renderAll();return}
  if(d.goal){const A=data.ai,x=(A.goal||'').split('、').filter(Boolean),i=x.indexOf(d.goal);i>=0?x.splice(i,1):x.push(d.goal);A.goal=x.join('、');persist();renderSheet();return}
  if(b.id==='aiCopy'){copy(aiText(),b,'已复制');return}
  if(b.id==='askNo'){const a=askCfg;if(a.onNo)a.onNo();else{closeSheet();renderAll()}return}
  if(b.id==='askYes'){const a=askCfg,i=$('askIn'),err=a.onYes(i?i.value:undefined);if(typeof err==='string')$('askErr').textContent=err;return}
  if(b.id==='save'){if(!draft.rid&&!draft.color){const cn=$('cwname');if(cn){cn.textContent='先滚一下，选个颜色';cn.style.color='var(--accent)'}return}
    if(b.classList.contains('go'))return;b.classList.add('go');setTimeout(()=>{if(navigator.vibrate)navigator.vibrate(10);const dup=findDup();
    if(dup)ask({title:'这条线是不是已经在爬了',body:`这家岩馆有一条在爬的「${esc(dup.name)} · ${meta(dup)}」，${lab(dup.since)} 开始爬，已经爬了 ${climbsOf(dup.id).length} 次。<br><br>是同一条，这次就记到它上面。是新定的线，就另建一条，旧的那条标成已拆线。`,
      yes:'是同一条',no:'是新定的线',onYes:()=>finishSave(dup),onNo:()=>{dup.retired=true;finishSave()}});
    else finishSave()},matchMedia('(prefers-reduced-motion: reduce)').matches?0:340);return}
  if(b.id==='backup'){data.bk=TODAY;persist();return copy(JSON.stringify(data),b,'已复制')}
  if(b.id==='bkFile')return backupFile(b);
  if(b.id==='rsFile'){$('rsIn').click();return}
  if(b.id==='restore'){ask({title:'粘贴恢复记录',body:'把之前复制的那段记录粘贴到下面。',input:'',area:true,yes:'下一步',onYes:restoreFrom});return}
  if(b.id==='wipe2')return wipeDemo();
  if(b.id==='gymBtn')mode='gym';
  if(d.gym){data.gym=data.gyms[+d.gym].name;persist();afterGym();return}
  if(b.id==='gymAdd'){const n=$('gymName').value.trim();if(!n){$('gymName').focus();return}
    if(!data.gyms.some(g=>g.name===n))data.gyms.push({name:n,wall:15});data.gym=n;persist();afterGym();return}
  if(b.id==='newRoute'){startForm(null);mode='form'}
  if(b.id==='toPick')mode='pick';
  if(d.pick){startForm(d.pick);mode='form'}
  if(d.v&&(b.parentNode.id==='gw'||b.parentNode.id==='lw')){fwTo(b.parentNode,b.parentNode.id==='lw',d.v,true);return}
  if(b.id==='pv'){if(draft.type==='b')return;mode='draw';padPts=[];renderSheet();return}
  if(b.id==='drawBack')mode='form';
  if(b.id==='drawAuto'){draft.shape=null;mode='form'}
  if(b.id==='drawOk'){const sh=toShape(padPts);if(!sh){$('drawErr').textContent='线太短了。从地面往上，一笔画到顶再试一次。';return}draft.shape=sh;mode='form'}
  if(d.ty)draft.type=d.ty;
  if(d.g){const G=scale(draft.type),i=Math.max(0,Math.min(G.length-1,G.indexOf(dGrade())+ +d.g));draft.type==='b'?draft.gb=G[i]:draft.gl=G[i]}
  if(d.m)draft.mode=d.m;
  if(d.cm)draft.mode=d.cm;
  if(d.l)draft.wall=Math.max(5,Math.min(40,draft.wall+ +d.l));
  if(d.r)draft.result=d.r;
  if(d.h)draft.hangs=Math.max(1,Math.min(6,draft.hangs+ +d.h));
  if(d.y)draft.why=draft.why===d.y?null:d.y;
  renderSheet()};
const findDup=()=>{if(draft.rid||!norm(draft.name))return null;const o={gym:data.gym,type:draft.type,grade:dGrade(),mode:draft.mode,wall:draft.wall,name:draft.name};return active().find(x=>sameLine(x,o))||null};
function finishSave(useRoute){const gm=draft.type==='b'?null:MODEG(draft.mode);saveDraft(useRoute);routeSel=gm;viewDate=null;closeSheet();go(page==='route'?'route':'today')}
// 备份成文件：手机上走系统分享（可存到"文件"或发给自己），电脑上直接下载
function backupFile(btn){data.bk=TODAY;persist();const name='岩迹备份-'+TODAY+'.json',txt=JSON.stringify(data);
  const flash=t=>{const o=btn.textContent;btn.textContent=t;setTimeout(()=>{btn.textContent=o},1600)};
  const dl=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);flash('已存成文件')};
  try{const f=new File([txt],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).then(()=>flash('已备份'),e=>{if(!e||e.name!=='AbortError')dl()});return}}catch(e){}
  dl()}
// 恢复：检查内容是不是岩迹的记录，再问一次才替换。返回字符串表示出错
function restoreFrom(t){let o;
  try{o=JSON.parse(t);if(!Array.isArray(o.routes)||!Array.isArray(o.climbs)||!Array.isArray(o.gyms))throw 0;
    const ids=new Set(o.routes.map(r=>r.id));if(o.climbs.some(c=>!ids.has(c.rid)))throw 0}catch(err){return'这段内容不是岩迹的记录，没有改动任何东西。'}
  const mine=data.routes.filter(r=>!r.demo).length;
  ask({title:'替换全部记录',body:`备份里有 ${o.routes.length} 条线、${o.climbs.length} 次攀爬。${mine?`现在这台设备上的 ${mine} 条线和它们的记录会被替换掉，不能撤回。`:'现在这台设备上的记录会被它替换。'}`,lock:true,yes:'替换',onYes:()=>{data=o;persist();viewDate=null;closeSheet();go('today')}})}
$('sheet').addEventListener('change',e=>{if(e.target.id!=='rsIn')return;const f=e.target.files[0];if(!f)return;
  f.text().then(t=>{const err=restoreFrom(t);if(err)ask({title:'没能恢复',body:err,yes:'知道了',no:'关闭'})})});
// 面板里的询问，代替浏览器自带的弹窗（有些环境会屏蔽弹窗）
let askCfg=null;
function ask(cfg){askCfg=cfg;mode='ask';renderSheet();phone.classList.add('open')}
function afterGym(){renderAll();startLog()}
function startLog(){if(!data.gym){mode='gym'}else if(active().length){mode='pick'}else{startForm(null);mode='form'}renderSheet()}
const phone=$('phone');
function openSheet(m){if(m==='log')startLog();else{mode=m;renderSheet()}phone.classList.add('open')}
function closeSheet(){phone.classList.remove('open')}
$('fab').onclick=()=>openSheet('log');
$('veil').onclick=()=>{cancelStrip();closeSheet();renderAll()};

/* ---------- 导航 ---------- */
let page='today';
function syncFab(){$('fab').style.display=page==='today'&&(!viewDate||viewDate===TODAY)?'':'none'}
function renderAll(){renderToday();renderMount();renderPyr();renderReview();if(page==='route')renderRoute()}
function go(p){playTok++;if(p!=='mount'||page!=='mount')mountView=null;page=p;renderAll();document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id==='p-'+p));
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.p===(p==='route'?backTo:p)));
  syncFab();document.querySelector('main').scrollTop=0;if(p==='mount'){wheelTo(expedition().act,false);mountAnim()}if(p==='review')heatTo()}
$('nav').onclick=e=>{const b=e.target.closest('button');if(b){if(b.dataset.p==='today'){viewDate=null;dayFrom='today'}go(b.dataset.p)}};
renderAll();
{const p0=new URLSearchParams(location.search).get('page');if(['mount','pyr','review'].includes(p0))go(p0)}
