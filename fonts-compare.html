<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>绳迹 · 字体对比</title>
<style>
:root{--paper:#F4F0E6;--ink:#1F1D19;--muted:#726C5F;--hair:#D8D1C1;--s:.72}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#E7E1D3;color:var(--ink);font-family:-apple-system,"PingFang SC",sans-serif;padding:28px 24px 40px}
header{max-width:1240px;margin:0 auto 20px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
h1{font-family:"Songti SC",serif;font-weight:600;font-size:24px}
p.sub{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.6;max-width:640px}
.tabs{display:inline-flex;border:1px solid var(--hair);border-radius:10px;overflow:hidden;background:var(--paper)}
.tabs button{border:none;background:none;padding:8px 14px;font-size:13px;color:var(--ink);cursor:pointer;font-family:inherit}
.tabs button.on{background:var(--ink);color:var(--paper)}
.grid{display:flex;flex-wrap:wrap;gap:28px;justify-content:center}
figure{width:calc(390px * var(--s))}
figcaption{margin-bottom:10px;min-height:58px}
figcaption b{display:block;font-size:15px;font-weight:600}
figcaption span{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.frame{width:calc(390px * var(--s));height:calc(844px * var(--s));border-radius:calc(38px * var(--s));overflow:hidden;border:1px solid #cfc7b4;box-shadow:0 20px 50px rgba(60,50,30,.18);background:var(--paper)}
iframe{width:390px;height:844px;border:0;transform:scale(var(--s));transform-origin:0 0}
</style>
</head>
<body>
<header>
  <div>
    <h1>字体对比</h1>
    <p class="sub">同一份示例数据，只换标题、线路名、按钮这些衬线字。数字和难度保持等宽字体，说明小字保持苹方。每一屏都可以直接点着用。楷体第一次加载要几秒，仓耳今楷文件较大，稍等它从宋体换过来。</p>
  </div>
  <div class="tabs" id="tabs">
    <button data-p="today" class="on">今天</button><button data-p="mount">山</button><button data-p="pyr">阶</button><button data-p="review">复盘</button>
  </div>
</header>
<div class="grid">
  <figure><figcaption><b>宋体（原来）</b><span>系统自带，零加载。端正、偏书卷气</span></figcaption><div class="frame"><iframe data-f="songti" src="shengji-prototype.html?font=songti"></iframe></div></figure>
  <figure><figcaption><b>霞鹜文楷（已采用）</b><span>开源 OFL，商用免费。按字分块加载，首屏约几百 KB</span></figcaption><div class="frame"><iframe data-f="" src="shengji-prototype.html"></iframe></div></figure>
  <figure><figcaption><b>仓耳今楷02（Kami 默认）</b><span>仅限个人使用，商用需授权。单个字重约 19 MB，只适合本地预览</span></figcaption><div class="frame"><iframe data-f="tsanger" src="shengji-prototype.html?font=tsanger"></iframe></div></figure>
</div>
<script>
const frames=[...document.querySelectorAll('iframe')];
function load(page){frames.forEach(f=>{const q=new URLSearchParams();if(f.dataset.f)q.set('font',f.dataset.f);if(page!=='today')q.set('page',page);const qs=q.toString();f.src='shengji-prototype.html'+(qs?'?'+qs:'')})}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));load(b.dataset.p)};
</script>
</body>
</html>
